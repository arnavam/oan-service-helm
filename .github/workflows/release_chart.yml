name: Release Helm Chart

# Push a tag named v<chart version> (for example v8.0.91). The workflow packages
# frappe/ into frappe-<version>.tgz and attaches it to a GitHub release. The
# subcharts are committed under frappe/charts, so no repository access is needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Check the tag matches the chart version
        run: |
          version="$(sed -n 's/^version: *//p' frappe/Chart.yaml | head -n 1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match chart version v${version}" >&2
            exit 1
          fi
      - name: Package the chart
        run: |
          mkdir -p dist
          helm lint frappe
          helm package frappe --destination dist
          (cd dist && sha256sum ./*.tgz > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tgz dist/SHA256SUMS \
            --title "frappe ${GITHUB_REF_NAME#v}" \
            --generate-notes
