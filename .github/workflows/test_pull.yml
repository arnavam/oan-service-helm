name: Test Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  build_bench:
    name: Test Pull Request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

      # The upstream k3s install test (tests/compose.yaml) is not run: it installs the chart
      # without an application image, which the OAN chart leaves to each environment.
      - name: Lint the chart
        run: helm lint frappe -f tests/frappe/values.yaml
