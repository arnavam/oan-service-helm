{{- range .Values.extraWorkers }}
{{- if and .autoscaling .autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "frappe.fullname" $ }}-worker-{{ .name }}
  labels:
    {{- include "frappe.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "frappe.fullname" $ }}-worker-{{ .name }}
  minReplicas: {{ default 1 .autoscaling.minReplicas }}
  maxReplicas: {{ default 3 .autoscaling.maxReplicas }}
  metrics:
    {{- if .autoscaling.targetCPU }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetCPU }}
    {{- end }}
    {{- if .autoscaling.targetMemory }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .autoscaling.targetMemory }}
    {{- end }}
{{- end }}
{{- end }}
