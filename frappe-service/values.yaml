# Default values for frappe.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Database: enable mariadb-sts or postgresql-sts below for an in-cluster
# database, or disable both and configure an external database host here.
# dbHost: ""
# dbPort: 3306
# Required for an external database. The in-chart databases use postgres or root.
dbRootUser: ""
# dbRootPassword: ""
# dbRds: false
# dbExistingSecret: ""
# dbExistingSecretPasswordKey: "password"

# Configure external redis host
externalRedis:
  cache: ""
  queue: ""

image:
  repository: ""
  tag: v16.54.0
  pullPolicy: IfNotPresent

nginx:
  podAnnotations: {}
  replicaCount: 0
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 75
    targetMemory: 75
  # config: |
  #   # custom conf /etc/nginx/conf.d/default.conf
  environment:
    upstreamRealIPAddress: "127.0.0.1"
    upstreamRealIPRecursive: "off"
    upstreamRealIPHeader: "X-Forwarded-For"
    frappeSiteNameHeader: "$host"
    proxyReadTimeout: "120"
    clientMaxBodySize: "50m"
  livenessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Custom topologySpreadConstraints (uncomment and modify to override defaults)
  # topologySpreadConstraints:
  #   - maxSkew: 2
  #     topologyKey: failure-domain.beta.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway

  # Default topologySpreadConstraints (used if topologySpreadConstraints is not set)
  defaultTopologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
  envVars: []
  initContainers: []
  sidecars: []

worker:
  gunicorn:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    livenessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    readinessProbe:
      tcpSocket:
        port: 8000
      initialDelaySeconds: 5
      periodSeconds: 10
    service:
      type: ClusterIP
      port: 8000
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    args: []
    envVars:
    - name: FRAPPE_STREAM_LOGGING
      value: "1"
    initContainers: []
    sidecars: []

  default:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars:
    - name: FRAPPE_STREAM_LOGGING
      value: "1"
    initContainers: []
    sidecars: []

  short:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars:
    - name: FRAPPE_STREAM_LOGGING
      value: "1"
    initContainers: []
    sidecars: []

  long:
    podAnnotations: {}
    replicaCount: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars:
    - name: FRAPPE_STREAM_LOGGING
      value: "1"
    initContainers: []
    sidecars: []

  scheduler:
    podAnnotations: {}
    replicaCount: 1
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    livenessProbe:
      override: false
      probe: {}
    readinessProbe:
      override: false
      probe: {}
    envVars:
    - name: FRAPPE_STREAM_LOGGING
      value: "1"
    initContainers: []
    sidecars: []


  # Custom topologySpreadConstraints (uncomment and modify to override defaults)
  # topologySpreadConstraints:
  #   - maxSkew: 2
  #     topologyKey: failure-domain.beta.kubernetes.io/zone
  #     whenUnsatisfiable: ScheduleAnyway

  # Default topologySpreadConstraints (used if topologySpreadConstraints is not set)
  defaultTopologySpread:
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule


  healthProbe: |
    exec:
      command:
        - bash
        - -c
        - |-
          echo "Pinging backing services";
          {{- if (index .Values "mariadb-sts").enabled }}
          wait-for-it {{ include "frappe.fullname" . }}-mariadb-sts:3306 -t 1;
          {{- else if (index .Values "postgresql-sts").enabled }}
          wait-for-it {{ include "frappe.fullname" . }}-postgresql-sts:5432 -t 1;
          {{- else if .Values.dbHost }}
          wait-for-it {{ .Values.dbHost }}:{{ .Values.dbPort }} -t 1;
          {{- end }}
          {{- if .Values.externalRedis.cache }}
          wait-for-it $(echo {{ .Values.externalRedis.cache }} | sed 's,redis://,,') -t 1;
          {{- else if (index .Values "valkey-cache").enabled }}
          wait-for-it {{ .Release.Name }}-valkey-cache:6379 -t 1;
          {{- else if (index .Values "dragonfly-cache").enabled }}
          wait-for-it {{ .Release.Name }}-dragonfly-cache:6379 -t 1;
          {{- else if (index .Values "redis-cache").enabled }}
          wait-for-it {{ .Release.Name }}-redis-cache-master:6379 -t 1;
          {{- end }}
          {{- if .Values.externalRedis.queue }}
          wait-for-it $(echo {{ .Values.externalRedis.queue }} | sed 's,redis://,,') -t 1;
          {{- else if (index .Values "valkey-queue").enabled }}
          wait-for-it {{ .Release.Name }}-valkey-queue:6379 -t 1;
          {{- else if (index .Values "dragonfly-queue").enabled }}
          wait-for-it {{ .Release.Name }}-dragonfly-queue:6379 -t 1;
          {{- else if (index .Values "redis-queue").enabled }}
          wait-for-it {{ .Release.Name }}-redis-queue-master:6379 -t 1;
          {{- end }}
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5

socketio:
  podAnnotations: {}
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 75
    targetMemory: 75
  livenessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 10
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  service:
    type: ClusterIP
    port: 9000
  envVars:
  - name: FRAPPE_STREAM_LOGGING
    value: "1"
  initContainers: []
  sidecars: []

persistence:
  # When a subPath is set below, run a root init container in each pod that
  # creates and chowns the subPath dir(s) so a fresh, kubelet-created
  # (root-owned) directory is writable before the main containers start.
  subPathPermissions:
    enabled: true
  worker:
    enabled: true
    # existingClaim: ""
    # Subpath inside the PVC referenced by existingClaim to mount sites
    # into. Lets the worker share a PVC with another volume without the
    # two volumes' contents mixing at the mount root.
    # subPath: ""
    size: 8Gi
    # storageClass: "nfs"
    accessModes:
    - ReadWriteMany
  logs:
    # Container based log search and analytics stack recommended
    enabled: false
    # existingClaim: ""
    # Subpath inside the PVC referenced by existingClaim to mount logs
    # into. Lets logs share a PVC (e.g. the worker's) without the two
    # volumes' contents mixing at the mount root.
    # subPath: ""
    size: 8Gi
    # storageClass: "nfs"
    accessModes:
    - ReadWriteMany

# Ingress
ingress:
  # ingressName: ""
  # className: ""
  enabled: false
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
  - host: erp.cluster.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  tls: []
  #  - secretName: auth-server-tls
  #    hosts:
  #      - auth-server.local

httproute:
  enabled: false
  name: ""
  annotations: {}
  parentRefs:
  - gatewayName: "public-gateway"
    gatewayNamespace: "networking"
      # gatewayKind: "Gateway"
    gatewaySectionName: "http"
  hostnames:
  - "erp.example.com"
  rules:
  - matches:
    - pathType: "PathPrefix"
      path: "/"

jobs:
  volumePermissions:
    # jobName: ""
    enabled: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  configure:
    # jobName: ""
    enabled: true
    fixVolume: true
    backoffLimit: 3
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    envVars: []
    command: []
    args: []
  # ------------------------------------------------------------------------------
  # Site creation jobs
  #
  # IMPORTANT:
  # - Only ONE site-creation job should be enabled at a time.
  # - If BOTH `createSite.enabled` and `createMultipleSite.enabled` are set to true,
  #   then `createSite` will take precedence and `createMultipleSite` will be ignored.
  #
  # Backward compatibility:
  # - `createSite` is enabled by default to preserve existing behavior.
  # ------------------------------------------------------------------------------

  createSite:
    # jobName: ""
    enabled: true
    forceCreate: false
    siteName: "erp.cluster.local"
    # Required unless adminExistingSecret is set.
    adminPassword: ""
    adminExistingSecret: ""
    adminExistingSecretKey: "password"
    installApps: []
    dbType: "postgres"
    backoffLimit: 3
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  createMultipleSites:
    # jobName: ""
    enabled: false
    forceCreate: false
    sites:
    - name: "erp.cluster.local"
      installApps:
      - "frappe"
      # - name: "accounts.cluster.local"
      #   installApps:
      #     - "frappe"
      #     - "payments"
    # Required unless adminExistingSecret is set.
    adminPassword: ""
    adminExistingSecret: ""
    adminExistingSecretKey: "password"
    dbType: "postgres"
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Site deletion jobs
  #
  # IMPORTANT:
  # - Only ONE site-deletion job should be enabled at a time.
  # - If BOTH `dropSite.enabled` and `dropMultipleSites.enabled` are set to true,
  #   then `dropSite` will take precedence and `dropMultipleSites` will be ignored.
  #
  # Backward compatibility:
  # - `dropSite` remains the default behavior.
  # - `dropMultipleSites` is an additive, non-breaking feature.
  # ------------------------------------------------------------------------------

  dropSite:
    # jobName: ""
    enabled: false
    forced: false
    siteName: "erp.cluster.local"
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  dropMultipleSites:
    # jobName: ""
    enabled: false

    # Force deletion of sites without confirmation
    forced: false

    # List of sites to be dropped
    sites:
    - name: "site1.example.com"
    - name: "site2.example.com"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Backup jobs
  #
  # IMPORTANT:
  # - Only ONE backup job should be enabled at a time.
  # - If BOTH `backup.enabled` and `backupMultipleSites.enabled` are true,
  #   then `backup` takes precedence and `backupMultipleSites` is ignored.
  #
  # Backward compatibility:
  # - `backup` remains the default behavior for existing users.
  # - `backupMultipleSites` is an additive, non-breaking feature.
  #
  # This applies to both `backup` and `backupMultipleSites`.
  # ------------------------------------------------------------------------------

  backup:
    # jobName: ""
    enabled: false
    siteName: "erp.cluster.local"
    withFiles: true
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  backupMultipleSites:
    # jobName: ""
    enabled: false

    # Include files directory in the backup
    withFiles: true

    # List of sites to back up
    sites:
    - name: "erp.cluster.local"
      # - name: "accounts.cluster.local"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  # ------------------------------------------------------------------------------
  # Migrate jobs
  #
  # IMPORTANT:
  # - Only ONE migrate job should be enabled at a time.
  # - If BOTH `migrate.enabled` and `migrateMultipleSites.enabled` are true,
  #   then `migrate` takes precedence and `migrateMultipleSites` is ignored.
  #
  # Backward compatibility:
  # - `migrate` remains unchanged for existing users.
  # - `migrateMultipleSites` is additive, non-breaking feature.
  #
  # This applies to both `migrate` and `migrateMultipleSites`,
  # ------------------------------------------------------------------------------

  migrate:
    # jobName: ""
    enabled: false
    siteName: "erp.cluster.local"
    skipFailing: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  migrateMultipleSites:
    # jobName: ""
    enabled: false

    # Skip failing patches during migration
    skipFailing: false

    # List of sites to migrate (processed sequentially)
    sites:
    - name: "erp.cluster.local"
      # - name: "accounts.cluster.local"

    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  clearCache:
    enabled: false
    # jobName: ""
    # If empty, falls back to frappe.serviceAccountName helper
    serviceAccountName: ""
    initContainer:
      enabled: false
      image: alpine/kubectl:1.35.0
      deployment:
        # If empty → <fullname>-gunicorn
        name: ""
      # Rollout wait timeout
      timeout: 600s
    redisFlush:
      enabled: false
    backoffLimit: 0
    resources: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  custom:
    enabled: false
    jobName: ""
    labels: {}
    backoffLimit: 0
    initContainers: []
    containers: []
    restartPolicy: Never
    volumes: []
    nodeSelector: {}
    affinity: {}
    tolerations: []

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true

podSecurityContext:
  supplementalGroups: [1000]

securityContext:
  capabilities:
    add:
    - CAP_CHOWN
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

mariadb-sts:
  enabled: false
  image:
    repository: mariadb
    tag: "10.6"
    pullPolicy: IfNotPresent
  # Required when mariadb-sts is enabled.
  rootPassword: ""
  persistence:
    # storageClass: "nfs"
    size: 8Gi
  # Requests reserve capacity so the shared database is not the first pod
  # evicted under node memory pressure. No limits by default; set them per
  # environment. Use null (not {}) to drop these defaults.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  # max_connections: every Frappe service sharing this database opens
  # connections from gunicorn, workers, scheduler and socketio; the MariaDB
  # default of 151 runs out with a few services.
  myCnf: |
    [mysqld]
    skip-character-set-client-handshake
    skip-innodb-read-only-compressed
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    max_connections=300

dragonfly-cache:
  # Using DragonflyDB: https://www.dragonflydb.io/
  # https://github.com/dragonflydb/dragonfly/tree/main/helm/dragonfly
  # To enable DragonflyDB for cache, set enabled to true
  # and set valkey-cache.enabled to false.
  enabled: false
  # host: ""
  # No persistence for cache

dragonfly-queue:
  # Using DragonflyDB: https://www.dragonflydb.io/
  # https://github.com/dragonflydb/dragonfly/tree/main/helm/dragonfly
  # To enable DragonflyDB for queue, set enabled to true
  # and set valkey-queue.enabled to false.
  enabled: false
  # host: ""
  # Persistence can be enabled for queue
  storage:
    enabled: false
    # The size of the PersistentVolumeClaim.
    size: 8Gi
    # The name of the StorageClass to use. If not specified, the default StorageClass will be used.
    # storageClassName: "nfs"

postgresql-sts:
  enabled: true
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  # Superuser created on first start (POSTGRES_USER). Changing it later has no
  # effect on an existing data volume.
  postgresUser: "postgres"
  # Required when postgresql-sts is enabled.
  postgresPassword: ""
  # Every Frappe service sharing this database opens connections from gunicorn,
  # workers, scheduler and socketio; the PostgreSQL default of 100 runs out
  # with a few services. Passed as -c max_connections=<n>.
  maxConnections: 300
  # Extra postgres server flags, e.g. ["-c", "shared_buffers=256MB"].
  extraArgs: []
  persistence:
    # storageClass: "nfs"
    size: 8Gi
  # Requests reserve capacity so the shared database is not the first pod
  # evicted under node memory pressure. No limits by default; set them per
  # environment. Use null (not {}) to drop these defaults.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi

redis-cache:
  # To enable the classic Bitnami Redis subchart for cache, set enabled to true
  # and set dragonfly-cache.enabled to false.
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: "7.0"
  # Frappe connects with a plain redis://host:6379 URL.
  architecture: standalone
  auth:
    enabled: false
  # Values passed to the bitnami/redis subchart can be defined here.

redis-queue:
  # To enable the classic Bitnami Redis subchart for queue, set enabled to true
  # and set dragonfly-queue.enabled to false.
  enabled: true
  image:
    repository: bitnamilegacy/redis
    tag: "7.0"
  # Frappe connects with a plain redis://host:6379 URL.
  architecture: standalone
  auth:
    enabled: false
  # Values passed to the bitnami/redis subchart can be defined here.

valkey-cache:
  # To enable the official Valkey subchart for cache, set enabled to true
  # and set dragonfly-cache.enabled and redis-cache.enabled to false.
  enabled: false
  image:
    repository: valkey/valkey
    tag: "7.2" # check for latest version
  # Values passed to the valkey/valkey subchart can be defined here.

valkey-queue:
  # To enable the official Valkey subchart for queue, set enabled to true
  # and set dragonfly-queue.enabled and redis-queue.enabled to false.
  enabled: false
  image:
    repository: valkey/valkey
    tag: "7.2" # check for latest version
  # Values passed to the valkey/valkey subchart can be defined here.

# Job that configures the site after create-site, on every install and upgrade.
siteConfig:
  enabled: false
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  # Run `bench migrate` at the end. Use this instead of jobs.migrate.
  migrate: true
  # Keys merged into sites/<jobs.createSite.siteName>/site_config.json.
  # Empty strings are skipped.
  values: {}
  # site_config.json keys read from Secrets.
  secretValues: {}
  # Files written under the site directory from Secrets.
  files: []
  # - path: keys/jwt_v1.pem
  #   secretName: my-jwt
  #   secretKey: jwt_v1.pem
  # Demo data image (see seed/ in this repository), loaded after migrate on every deploy.
  # Only missing records are created.
  seed:
    enabled: false
    image:
      repository: ""
      tag: ""
      pullPolicy: IfNotPresent
    # Optional password for the users it creates. Passwords cannot be exported.
    userPasswordSecret:
      name: ""
      key: password

# Workers for app-specific queues (queue name: RQ timeout in seconds).
# Needs siteConfig.enabled, which registers the queues.
extraWorkers: []
# - name: routing
#   queues:
#     my_queue: 300
#   replicaCount: 1
#   resources: {}
#   # Needs resource requests: the targets are percentages of them. replicaCount is ignored.
#   autoscaling:
#     enabled: false
#     minReplicas: 1
#     maxReplicas: 3
#     targetCPU: 75
#     targetMemory: 75

# Extra Services for a gateway in another cluster.
gatewayAccess:
  enabled: false
  # NodePort, or LoadBalancer with the provider's internal-load-balancer annotations.
  type: NodePort
  annotations: {}
  loadBalancerSourceRanges: []
  web:
    enabled: true
    port: 8000
    nodePort: null
  socket:
    enabled: false
    port: 9000
    nodePort: null
